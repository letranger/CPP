<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>VPL 21B 金榜又題名時 — 解題思路</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --muted:#94a3b8;
    --accent:#38bdf8; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --hl:#fde047;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,"Noto Sans TC",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:24px;
  }
  h1{margin:0 0 6px; color:var(--accent)}
  .sub{color:var(--muted); margin-bottom:18px; font-size:14px}
  .stage{
    width:min(1040px,100%); background:var(--panel); border-radius:14px;
    padding:24px; box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .steps-nav{
    display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;
  }
  .chip{
    flex:1; min-width:140px; padding:10px 12px; background:#0b1224;
    border:1px solid #1f2a44; border-radius:8px; cursor:pointer;
    font-size:13px; color:var(--muted); transition:.3s; text-align:center;
  }
  .chip.active{background:var(--accent); color:#0b1224; border-color:var(--accent); font-weight:700}
  .chip .num{display:block; font-size:11px; opacity:.7}

  .panel{
    background:#0b1224; border-radius:12px; padding:22px;
    border:1px solid #1f2a44; min-height:420px;
    animation:fade .35s ease;
  }
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .panel h2{margin:0 0 6px; color:var(--hl); font-size:22px}
  .panel .why{color:var(--muted); margin-bottom:18px; font-size:14px}

  .body-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  @media(max-width:760px){.body-grid{grid-template-columns:1fr}}
  .box{background:#0f1a33; border:1px solid #1f2a44; border-radius:10px; padding:14px}
  .box h4{margin:0 0 10px; font-size:12px; color:var(--muted); letter-spacing:1.5px}

  table{width:100%; border-collapse:collapse; font-family:"SF Mono",monospace; font-size:14px}
  th,td{padding:6px 10px; text-align:center; border-bottom:1px solid #233055}
  th{color:var(--muted); font-size:11px; font-weight:500; letter-spacing:1px}
  td.hl{background:rgba(253,224,71,.15); color:var(--hl); font-weight:700}
  td.in{background:rgba(56,189,248,.12)}
  td.out{background:rgba(34,197,94,.12)}

  pre.code{
    margin:0; background:#0a1020; padding:14px; border-radius:8px;
    border:1px solid #1f2a44; font-size:13px; line-height:1.6;
    overflow-x:auto; white-space:pre; color:#cbd5e1;
  }
  .kw{color:#c084fc} .st{color:#86efac} .cm{color:#64748b; font-style:italic} .nm{color:#fbbf24}

  .arrow{font-size:32px; color:var(--accent); text-align:center; margin:6px 0}
  ul.note{margin:0; padding-left:20px; line-height:1.8; font-size:14px}
  ul.note li{margin-bottom:6px}
  .tag{display:inline-block; padding:2px 8px; border-radius:99px; background:#1e293b; color:var(--hl); font-size:12px; margin-right:4px}
  .bad{color:var(--bad); font-weight:700}
  .good{color:var(--good); font-weight:700}

  .controls{margin-top:18px; display:flex; gap:10px; justify-content:center; align-items:center}
  button{
    background:var(--accent); color:#0b1224; border:0; border-radius:8px;
    padding:9px 20px; font-weight:700; cursor:pointer; font-size:14px;
  }
  button.sec{background:#334155; color:var(--ink)}
  button:disabled{opacity:.4; cursor:not-allowed}
</style>
</head>
<body>
  <h1>VPL 21B · 金榜又題名時</h1>
  <div class="sub">解題思路：六個步驟</div>

  <div class="stage">
    <div class="steps-nav" id="nav"></div>
    <div id="panel"></div>
    <div class="controls">
      <button class="sec" id="prev">← 上一步</button>
      <button id="next">下一步 →</button>
    </div>
  </div>

<script>
const slides = [
  {
    title:"① 看懂題目：座號 ≠ 名次 ≠ 順序",
    why:"先弄清楚三個容易搞混的東西，後面才不會走錯路。",
    html:`
      <div class="body-grid">
        <div class="box">
          <h4>輸入</h4>
          <table>
            <tr><th>座號</th><th>分數</th></tr>
            <tr><td>2</td><td>398</td></tr>
            <tr><td>3</td><td>424</td></tr>
            <tr><td class="in">5</td><td class="in">487</td></tr>
            <tr><td>6</td><td>288</td></tr>
            <tr><td>8</td><td>392</td></tr>
          </table>
        </div>
        <div class="box">
          <h4>三個概念分清楚</h4>
          <ul class="note">
            <li><span class="tag">座號</span>學生的編號，可能跳號（2,3,<b>5</b>,6,8）</li>
            <li><span class="tag">名次</span>分數高低排出來的排名，1 是最高</li>
            <li><span class="tag">順序</span>輸出時要照<b>輸入順序</b>，不是按名次！</li>
          </ul>
          <div style="margin-top:14px; padding:10px; background:#0a1020; border-radius:6px; font-size:13px">
            ⚠️ 如果直接 sort，<span class="bad">座號順序會被打亂</span>，這是最常見的陷阱。
          </div>
        </div>
      </div>`
  },
  {
    title:"② 讀入：用二維陣列存資料",
    why:"本週主題：二維陣列。一個 s[n][3] 就能同時存座號、分數、名次，每一列代表一個學生。",
    html:`
      <div class="body-grid">
        <div class="box">
          <h4>資料結構：s[n][3]</h4>
          <table>
            <tr><th>i</th><th>[i][0]<br>座號</th><th>[i][1]<br>分數</th><th>[i][2]<br>名次</th></tr>
            <tr><td>0</td><td>2</td><td>398</td><td style="color:var(--muted)">?</td></tr>
            <tr><td>1</td><td>3</td><td>424</td><td style="color:var(--muted)">?</td></tr>
            <tr><td>2</td><td>5</td><td>487</td><td style="color:var(--muted)">?</td></tr>
            <tr><td>3</td><td>6</td><td>288</td><td style="color:var(--muted)">?</td></tr>
            <tr><td>4</td><td>8</td><td>392</td><td style="color:var(--muted)">?</td></tr>
          </table>
          <div style="margin-top:10px; font-size:13px; color:var(--muted)">
            列（row） = 第幾個學生，欄（col） = 屬性。<br>
            名次先空著，第 ③ 步再算。
          </div>
        </div>
        <div class="box">
          <h4>程式碼</h4>
<pre class="code"><span class="kw">int</span> n; cin &gt;&gt; n;
<span class="kw">int</span> s[n][<span class="nm">3</span>];   <span class="cm">// 0:座號  1:分數  2:名次</span>

<span class="kw">for</span> (<span class="kw">int</span> i=0; i&lt;n; i++)
    cin &gt;&gt; s[i][<span class="nm">0</span>] &gt;&gt; s[i][<span class="nm">1</span>];</pre>
          <ul class="note" style="margin-top:12px">
            <li>一個二維陣列就管完所有欄位，不用開好幾個 1D</li>
            <li>不能用「座號當索引」（會跳號）</li>
            <li>保留輸入順序，後面輸出才不用排回去</li>
          </ul>
        </div>
      </div>`
  },
  {
    title:"③ 依分數排序：整列一起換",
    why:"⚠️ 關鍵觀念：排序時是<b>整列（座號+分數+名次格）一起換</b>，不能只換分數那一欄，否則座號和分數就配錯人了！",
    html:`
      <div class="body-grid">
        <div class="box" style="border-color:var(--bad)">
          <h4 style="color:var(--bad)">❌ 錯誤：只換分數欄</h4>
          <table>
            <tr><th>座號</th><th>分數</th></tr>
            <tr><td>2</td><td class="hl">487</td></tr>
            <tr><td>3</td><td class="hl">424</td></tr>
            <tr><td>5</td><td class="hl">398</td></tr>
            <tr><td>6</td><td class="hl">392</td></tr>
            <tr><td>8</td><td class="hl">288</td></tr>
          </table>
          <div style="margin-top:10px; font-size:13px; color:var(--bad)">
            座號 2 變成 487 分？資料對應全錯！
          </div>
        </div>
        <div class="box" style="border-color:var(--good)">
          <h4 style="color:var(--good)">✓ 正確：整列一起換（分數由大到小）</h4>
          <table>
            <tr><th>座號</th><th>分數</th></tr>
            <tr><td class="hl">5</td><td class="hl">487</td></tr>
            <tr><td class="hl">3</td><td class="hl">424</td></tr>
            <tr><td class="hl">2</td><td class="hl">398</td></tr>
            <tr><td class="hl">8</td><td class="hl">392</td></tr>
            <tr><td class="hl">6</td><td class="hl">288</td></tr>
          </table>
          <div style="margin-top:10px; font-size:13px; color:var(--good)">
            座號跟著分數一起跑，配對不會錯。
          </div>
        </div>
      </div>
      <div class="arrow">↓</div>
      <div class="box">
        <h4>程式碼：選擇排序，依 col 1（分數）由大到小</h4>
<pre class="code"><span class="kw">for</span> (<span class="kw">int</span> i=0; i&lt;n-<span class="nm">1</span>; i++)
    <span class="kw">for</span> (<span class="kw">int</span> j=i+<span class="nm">1</span>; j&lt;n; j++)
        <span class="kw">if</span> (s[j][<span class="nm">1</span>] &gt; s[i][<span class="nm">1</span>]) {
            swap(s[i][<span class="nm">0</span>], s[j][<span class="nm">0</span>]);  <span class="cm">// 座號</span>
            swap(s[i][<span class="nm">1</span>], s[j][<span class="nm">1</span>]);  <span class="cm">// 分數</span>
            swap(s[i][<span class="nm">2</span>], s[j][<span class="nm">2</span>]);  <span class="cm">// 名次格（雖然還空著也一起換）</span>
        }</pre>
      </div>`
  },
  {
    title:"④ 填入名次",
    why:"既然分數已經由大到小排好，第 i 列的人就是第 (i+1) 名。直接把 i+1 寫進 col 2。",
    html:`
      <div class="body-grid">
        <div class="box">
          <h4>填完名次的 s[n][3]</h4>
          <table>
            <tr><th>i</th><th>[i][0]<br>座號</th><th>[i][1]<br>分數</th><th>[i][2]<br>名次</th></tr>
            <tr><td>0</td><td>5</td><td>487</td><td class="hl">1</td></tr>
            <tr><td>1</td><td>3</td><td>424</td><td class="hl">2</td></tr>
            <tr><td>2</td><td>2</td><td>398</td><td class="hl">3</td></tr>
            <tr><td>3</td><td>8</td><td>392</td><td class="hl">4</td></tr>
            <tr><td>4</td><td>6</td><td>288</td><td class="hl">5</td></tr>
          </table>
        </div>
        <div class="box">
          <h4>程式碼</h4>
<pre class="code"><span class="kw">for</span> (<span class="kw">int</span> i=0; i&lt;n; i++)
    s[i][<span class="nm">2</span>] = i + <span class="nm">1</span>;</pre>
          <ul class="note" style="margin-top:14px">
            <li>因為剛剛已經由大到小排序，索引 i 就代表名次 i+1</li>
            <li>用 2D 陣列的好處：名次直接寫在同一列，不會跟人跑掉</li>
          </ul>
        </div>
      </div>`
  },
  {
    title:"⑤ 依座號排序：換回輸入順序",
    why:"題目要求輸出順序是「原本輸入順序」。範例的輸入剛好就是座號由小到大，所以再依座號排一次就能回到正確順序。",
    html:`
      <div class="body-grid">
        <div class="box">
          <h4>排序後的 s[n][3]（依座號由小到大）</h4>
          <table>
            <tr><th>i</th><th>[i][0]<br>座號</th><th>[i][1]<br>分數</th><th>[i][2]<br>名次</th></tr>
            <tr><td>0</td><td class="hl">2</td><td>398</td><td>3</td></tr>
            <tr><td>1</td><td class="hl">3</td><td>424</td><td>2</td></tr>
            <tr><td>2</td><td class="hl">5</td><td>487</td><td>1</td></tr>
            <tr><td>3</td><td class="hl">6</td><td>288</td><td>5</td></tr>
            <tr><td>4</td><td class="hl">8</td><td>392</td><td>4</td></tr>
          </table>
          <div style="margin-top:10px; font-size:13px; color:var(--good)">
            名次已經填好了，現在跟著座號一起搬，每個人的名次不會跑掉。
          </div>
        </div>
        <div class="box">
          <h4>程式碼：選擇排序，依 col 0（座號）由小到大</h4>
<pre class="code"><span class="kw">for</span> (<span class="kw">int</span> i=0; i&lt;n-<span class="nm">1</span>; i++)
    <span class="kw">for</span> (<span class="kw">int</span> j=i+<span class="nm">1</span>; j&lt;n; j++)
        <span class="kw">if</span> (s[j][<span class="nm">0</span>] &lt; s[i][<span class="nm">0</span>]) {
            swap(s[i][<span class="nm">0</span>], s[j][<span class="nm">0</span>]);
            swap(s[i][<span class="nm">1</span>], s[j][<span class="nm">1</span>]);
            swap(s[i][<span class="nm">2</span>], s[j][<span class="nm">2</span>]);  <span class="cm">// 名次也要跟著走</span>
        }</pre>
          <ul class="note" style="margin-top:10px">
            <li>同樣是<b>三欄一起 swap</b>，不能漏掉名次</li>
            <li>條件改成 <code>&lt;</code>（由小到大）</li>
          </ul>
        </div>
      </div>`
  },
  {
    title:"⑥ 輸出",
    why:"依序印出每一列：座號、名次、分數。",
    html:`
      <div class="body-grid">
        <div class="box">
          <h4>程式碼</h4>
<pre class="code"><span class="kw">for</span> (<span class="kw">int</span> i=0; i&lt;n; i++)
    cout &lt;&lt; s[i][<span class="nm">0</span>] &lt;&lt; <span class="st">" "</span>
         &lt;&lt; s[i][<span class="nm">2</span>] &lt;&lt; <span class="st">" "</span>
         &lt;&lt; s[i][<span class="nm">1</span>] &lt;&lt; endl;</pre>
          <ul class="note" style="margin-top:12px">
            <li>輸出順序：座號 [0]、名次 [2]、分數 [1]</li>
            <li>注意欄位順序別搞錯</li>
          </ul>
        </div>
        <div class="box">
          <h4>實際輸出</h4>
<pre class="code" style="color:#86efac">2 3 398
3 2 424
5 1 487
6 5 288
8 4 392</pre>
          <div style="margin-top:14px; padding:10px; background:#0a1020; border-radius:6px; font-size:13px">
            ✓ 完成。整個流程用一個 <b>s[n][3]</b> 二維陣列 + 兩次排序搞定。
          </div>
        </div>
      </div>`
  },
];

let cur = 0;
const $ = id => document.getElementById(id);

function renderNav(){
  $('nav').innerHTML = slides.map((s,i)=>
    `<div class="chip ${i===cur?'active':''}" data-i="${i}">
       <span class="num">STEP ${i+1}</span>${s.title.replace(/^[①②③④⑤⑥]\s*/,'').split('：')[0]}
     </div>`).join("");
  $('nav').querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{ cur = +c.dataset.i; render(); };
  });
}
function render(){
  const s = slides[cur];
  $('panel').innerHTML = `<div class="panel"><h2>${s.title}</h2><div class="why">${s.why}</div>${s.html}</div>`;
  renderNav();
  $('prev').disabled = cur===0;
  $('next').disabled = cur===slides.length-1;
}
$('next').onclick = ()=>{ if(cur<slides.length-1){cur++; render();} };
$('prev').onclick = ()=>{ if(cur>0){cur--; render();} };
render();
</script>
</body>
</html>
